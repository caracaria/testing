name: StormDNS Direct Tunnel
on: [workflow_dispatch]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install and Run StormDNS
        run: |
          # نصب اسکریپت
          sudo bash <(curl -Ls https://raw.githubusercontent.com/nullroute1970/StormDNS/main/server_linux_install.sh)
          # سرویس را استارت بزن
          sudo systemctl start stormdns || echo "سرویس نصب شد"

      - name: Create Public Tunnel
        run: |
          # نصب کلاودفلرد بدون نیاز به اکانت (نسخه آرگو)
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          
          # اجرای تونل روی پورت 80 (اگر پورت دیگری نیاز داری تغییرش بده)
          ./cloudflared tunnel --url http://localhost:80
