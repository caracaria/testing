name: StormDNS Manual Setup
on: [workflow_dispatch] 

jobs:
  manual-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: |
          # دانلود و نصب (بدون اجرای نهایی سرویس‌ها)
          curl -Ls https://raw.githubusercontent.com/nullroute1970/StormDNS/main/server_linux_install.sh -o install.sh
          chmod +x install.sh
          # فعلاً فقط نصب را انجام بده، بدون اینکه به سوالات تعاملی گیر کند
          sudo bash install.sh || echo "نصب انجام شد، حالا دستی تنظیم می‌کنیم"

      - name: Debug and Configure
        uses: mxschmitt/action-tmate@v3
