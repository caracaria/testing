name: Tailscale Exit Node & VPS

on:
  workflow_dispatch:

jobs:
  run-exit-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Tailscale Exit Node
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node --ssh --hostname=gh-runner-node

      - name: Enable IP Forwarding & NAT
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          
          # پیدا کردن کارت شبکه اصلی به صورت خودکار
          WAN_IFACE=$(ip route show default | awk '{print $5; exit}')
          
          # فعال‌سازی NAT و عبور ترافیک
          sudo iptables -t nat -A POSTROUTING -o $WAN_IFACE -j MASQUERADE
          sudo iptables -A FORWARD -i tailscale0 -j ACCEPT
          sudo iptables -A FORWARD -m state --state RELATED,ESTABLISHED -j ACCEPT

      - name: Keep Alive (6 Hours)
        run: |
          echo "Tailscale is running and connected."
          sleep 21600
