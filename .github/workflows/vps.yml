name: Tailscale Exit Node & VPS

on:
  workflow_dispatch:

jobs:
  run-exit-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Kernel IP Forwarding & UDP Offloading
        run: |
          # فعال‌سازی IP Forwarding
          echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          sudo sysctl -p /etc/sysctl.d/99-tailscale.conf
          
          # نصب ابزار و تلاش برای فعال‌سازی UDP Offloading (بدون توقف در صورت ارور)
          sudo apt-get update && sudo apt-get install -y ethtool
          WAN_IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ethtool -K $WAN_IFACE rx-udp-gro-forwarding on rx-gro-list off || true

      - name: Start Tailscale Exit Node
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node --ssh --hostname=gh-runner-node

      - name: Enable NAT, MTU 1280 & TCPMSS Clamp
        run: |
          WAN_IFACE=$(ip route show default | awk '{print $5; exit}')
          
          # ۱. تنظیم سایز MTU روی کارت شبکه تیل‌اسکیل
          sudo ip link set dev tailscale0 mtu 1280
          
          # ۲. فعال‌سازی NAT
          sudo iptables -t nat -A POSTROUTING -o $WAN_IFACE -j MASQUERADE
          sudo iptables -A FORWARD -i tailscale0 -j ACCEPT
          sudo iptables -A FORWARD -m state --state RELATED,ESTABLISHED -j ACCEPT
          
          # ۳. فعال‌سازی TCPMSS Clamping
          sudo iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu

      - name: Keep Alive (6 Hours)
        run: |
          echo "Tailscale Exit Node is running and fully optimized!"
          sleep 21600
